name: mc-server-installer
adopt-info: mc-server-installer
summary: Minecraft Server Downloader and Installer/Configuration Tool
description: |
    A Minecraft Server installer and configuration snap that downloads the latest .jar file 
    and allows you to start your server with the amount of RAM you choose. 
    
    Admins may now run custom MAX RAM settings! Minimum RAM requirements are 1024M, so please
    keep this in mind. Additionally, -Xmn values have been reduced to 128M to keep with current
    guidance. See: https://minecraft.gamepedia.com/Server/Requirements 
    
    You can also backup your entire server with option 10 in the menu. They are pushed to
    /home/user/ so that uninstalling the snap won't affect your backups. 

website: https://minecraft.net
contact: https://github.com/kz6fittycent/mc-server-installer/issues
issues: https://github.com/kz6fittycent/mc-server-installer/issues
source-code: https://github.com/kz6fittycent/mc-server-installer
icon: snap/local/mc-server-installer.png
donation: https://www.patreon.com/kz6fittycent

license: MIT
base: core24
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

# The 2.0 background service runs the Minecraft server as this unprivileged
# user, never as root.
system-usernames:
  snap_daemon: shared

apps:
  # Owns the Minecraft server. systemd starts it at install and at boot,
  # outside anyone's login, so logging out no longer kills the server.
  service:
    command: mcsi-service
    daemon: simple
    install-mode: enable
    restart-condition: on-failure
    # On a refresh or shutdown, signal only the service: it stops Minecraft
    # the same way the Stop button does ("stop" on the console, then wait
    # for the save). The default signals Java at the same moment, which
    # skips that path.
    stop-mode: sigterm
    # Room for the world to save.
    stop-timeout: 3m
    plugs:
      - network
      - network-bind

  # The menu: a front end for the service. It never runs the server itself.
  mc-server-installer:
    command: mcsi-menu
    plugs:
      - network
      - home  # "Back up now" copies to the Home folder; option 12 reads a jar

  # Command-line access to the service, for testing and support.
  ctl:
    command: mcsi-ctl

parts:
  mc-server-installer:
    # The checked-out commit, not a fresh clone of GitHub's master: the
    # security rebuild workflow rebuilds the exact commit stable came from.
    source: .
    plugin: nil
    
    override-pull: |
      craftctl default
      # --match 'v*': the snap-rev-<revision> tags the CI workflows push
      # must not become the version. -C: parts/ isn't inside the repo
      # when building in LXD (snapcore/action-build).
      craftctl set version="$(git -C "$CRAFT_PROJECT_DIR" describe --tags --match 'v*' | sed 's/^v//' | cut -d "-" -f1)"

    build-packages:
      - git  # for the version (override-pull)
      - openjdk-25-jre-headless
            
    stage-packages:
      - openjdk-25-jre-headless
      - libhsdis0-fcml

  publish:
    plugin: dump
    source: scripts

  # The service and the menu. The service uses the standard library only
  # (core24's python3); the menu also needs Textual, from the part below.
  mcsi:
    plugin: dump
    source: src
    organize:
      mcsi: lib/mcsi

  menu-deps:
    plugin: python
    source: snap/local/menu
    python-requirements:
      - requirements.txt
