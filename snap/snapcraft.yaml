name: mc-server-installer
adopt-info: mc-server-installer
title: Minecraft Server Installer
summary: Run your own Minecraft Java Edition server at home, for the whole family
description: |
  Set up a Minecraft: Java Edition server on your own computer in a couple of
  minutes, so your family can play together in one world.

  Run `mc-server-installer` in a terminal. A short setup asks for a server name
  and how much memory to use, then downloads Minecraft and starts the server. It
  shows the address to type into Minecraft.

  The server runs in the background: close the window, log out, or restart the
  computer, and it keeps going (or comes back by itself).

  - Anyone at home can join - or only the players you add (whitelist), with their
    names checked with Mojang.
  - Daily backups while the server runs (the newest 7 are kept), plus a backup
    before every update or restore. Restore any of them from the menu.
  - Tells you when a new Minecraft is out, and updates in one step, with the
    option to go back.
  - Players, operators, settings and a live server console, all from the menu.
  - Only the person who set the server up can change it; others on the computer
    can see how it is doing.
  - The server runs as an unprivileged user, and the only open port is the game's
    (25565).

  Moving from an older version? The first time you open the menu it offers to
  bring your world, whitelist and operators over. The original stays where it was.

  Not an official Minecraft product. Not approved by or associated with Mojang or
  Microsoft. You must agree to the Minecraft EULA (https://aka.ms/MinecraftEULA).

website: https://minecraft.net
contact: https://github.com/kz6fittycent/mc-server-installer/issues
issues: https://github.com/kz6fittycent/mc-server-installer/issues
source-code: https://github.com/kz6fittycent/mc-server-installer
icon: snap/local/mc-server-installer.png
donation: https://www.patreon.com/kz6fittycent

license: MIT
base: core24
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

# The 2.0 background service runs the Minecraft server as this unprivileged
# user, never as root.
system-usernames:
  snap_daemon: shared

apps:
  # Owns the Minecraft server. systemd starts it at install and at boot,
  # outside anyone's login, so logging out no longer kills the server.
  service:
    command: mcsi-service
    daemon: simple
    install-mode: enable
    restart-condition: on-failure
    # On a refresh or shutdown, signal only the service: it stops Minecraft
    # the same way the Stop button does ("stop" on the console, then wait
    # for the save). The default signals Java at the same moment, which
    # skips that path.
    stop-mode: sigterm
    # Room for the world to save.
    stop-timeout: 3m
    plugs:
      - network
      - network-bind

  # The menu: a front end for the service. It never runs the server itself.
  mc-server-installer:
    command: mcsi-menu
    plugs:
      - network
      - home  # "Back up now" copies to the Home folder; option 12 reads a jar

  # Command-line access to the service, for testing and support.
  ctl:
    command: mcsi-ctl

parts:
  mc-server-installer:
    # The checked-out commit, not a fresh clone of GitHub's master: the
    # security rebuild workflow rebuilds the exact commit stable came from.
    source: .
    plugin: nil
    
    override-pull: |
      craftctl default
      # --match 'v*': the snap-rev-<revision> tags the CI workflows push
      # must not become the version. -C: parts/ isn't inside the repo
      # when building in LXD (snapcore/action-build).
      craftctl set version="$(git -C "$CRAFT_PROJECT_DIR" describe --tags --match 'v*' | sed 's/^v//' | cut -d "-" -f1)"

    build-packages:
      - git  # for the version (override-pull)
      - openjdk-25-jre-headless
            
    stage-packages:
      - openjdk-25-jre-headless
      - libhsdis0-fcml

  publish:
    plugin: dump
    source: scripts

  # The service and the menu. The service uses the standard library only
  # (core24's python3); the menu also needs Textual, from the part below.
  mcsi:
    plugin: dump
    source: src
    organize:
      mcsi: lib/mcsi

  menu-deps:
    plugin: python
    source: snap/local/menu
    python-requirements:
      - requirements.txt
