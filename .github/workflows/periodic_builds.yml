name: Periodic Builds and Scans
on:
  # Runs at 10:30 UTC every Monday
  schedule:
    - cron:  '30 10 * * 1'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Both architectures, each on its own kind of machine (see snap-builds).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The snap's version comes from `git describe --tags`.
          fetch-depth: 0
          fetch-tags: true

      - uses: snapcore/action-build@v1
        id: build
        
      - uses: anchore/scan-action@v7
        id: scan
        with:
          severity-cutoff: critical
          fail-build: false
          
      - uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: snap-${{ matrix.arch }}
        
      - uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'
          # Plugs and Slots declarations to override default denial (requires store assertion to publish)
          # plugs: ./plug-declaration.json
          # slots: ./slot-declaration.json  
