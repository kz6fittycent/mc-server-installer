name: 📣 Call for Testing

# Chained off "🧪 Snap Builds" via workflow_run (rather than its own
# push: trigger) so this only fires once that workflow has actually
# passed on master - a PR build/review succeeding doesn't publish
# anything, and a push to master that FAILS review shouldn't get a
# candidate release or a testing issue either.
on:
  workflow_run:
    workflows: ["🧪 Snap Builds"]
    types: [completed]
    branches: [master]
  # By hand (Actions tab -> Run workflow), from master: publishes a
  # candidate of master's HEAD. "force" publishes even if nothing in the
  # snap changed since the last uploaded revision.
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if nothing in the snap changed"
        type: boolean
        default: true

permissions:
  contents: read

env:
  SNAP_NAME: mc-server-installer

jobs:
  # Dependabot merges to master often, and they only touch .github/. Skip
  # those: nothing in the snap changed since the last uploaded revision
  # (the newest snap-rev-<revision> tag), so there's nothing to test.
  changes:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'master') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.diff.outputs.publish }}
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Did anything in the snap change?
        id: diff
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [[ "$FORCE" == "true" ]]; then
            echo "Forced by hand - publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git tag --list 'snap-rev-*' --sort=-version:refname | head -1)"
          if [[ -n "$last" ]] && git diff --quiet "$last" HEAD -- . \
              ':(exclude).github' ':(exclude)README.md' ':(exclude).gitignore' ':(exclude)LICENSE'; then
            echo "Nothing outside .github/ and docs changed since $last - not publishing a candidate."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since ${last:-the beginning}:"
            git diff --stat "${last:-$(git rev-list --max-parents=0 HEAD)}" HEAD -- . ':(exclude).github' || true
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Rebuilds from scratch rather than reusing an artifact from the
  # triggering run, since snap-builds doesn't publish one - same commit
  # though, checked out via head_sha.
  publish-candidate:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.upload.outputs.revision }}
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine the app version
        id: version
        run: |
          # The same expression as override-pull in snap/snapcraft.yaml.
          version="$(git describe --tags --match 'v*' | sed 's/^v//' | cut -d "-" -f1)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: pack

      - name: Upload to the candidate channel
        id: upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          # Not "latest/candidate": a `snapcraft export-login` macaroon's
          # channel grant is the bare risk levels (stable/candidate/beta/
          # edge), not track-qualified, so the store rejects the
          # track-prefixed form with invalid-channel-permission.
          output="$(snapcraft upload "${{ steps.build.outputs.snap }}" --release=candidate)"
          echo "$output"

          revision="$(grep -Po 'Revision \K[0-9]+' <<< "$output")"
          if [[ -z "$revision" ]]; then
            echo "Could not parse a revision number out of 'snapcraft upload' output."
            exit 1
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      # The version alone doesn't say which commit a revision was built
      # from (it's the last v* tag, and master moves past it), so record
      # it: security-rebuild.yml rebuilds stable from this tag, and the
      # "changes" job above diffs against the newest one.
      - name: Record the commit this revision was built from
        run: |
          git tag "snap-rev-${{ steps.upload.outputs.revision }}" "${{ github.event.workflow_run.head_sha || github.sha }}"
          git push origin "snap-rev-${{ steps.upload.outputs.revision }}"

  open-issue:
    needs: publish-candidate
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue-number: ${{ steps.create.outputs.issue-number }}
    steps:
      - name: Ensure the call-for-testing label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "call-for-testing" \
            --repo "${{ github.repository }}" \
            --color "FBCA04" \
            --description "Automated candidate build ready for testing" \
            2>/dev/null || true

      - name: Create the call for testing issue
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-candidate.outputs.version }}
          REVISION: ${{ needs.publish-candidate.outputs.revision }}
        run: |
          # The "/promote <revision>[,<revision>...] stable [done]" syntax
          # here is what promote-to-stable.yml parses back out of the
          # triggering comment - keep it in sync with the pattern that
          # workflow matches if this changes.
          body=$(cat <<EOF
          A new candidate build of Minecraft Server Installer is ready for testing.

          **Version:** ${VERSION}
          **Revision:** ${REVISION}
          **Channel:** \`latest/candidate\`

          ## How to test

          1. Install or refresh to this build:

             \`\`\`
             sudo snap install ${SNAP_NAME} --channel latest/candidate
             # or, if already installed:
             sudo snap refresh ${SNAP_NAME} --channel latest/candidate
             \`\`\`

          2. Run \`${SNAP_NAME}\`. On a new install, a short setup walks you through it (the EULA, a server name, memory, who can play) and starts the server. If you used an older version, it first offers to move your world over.
          3. Join from Minecraft at the address shown at the top of the menu.
          4. Close the menu, log out, or restart the computer: the server should keep running, or come back by itself.
          5. Try Players (\`p\`), Backups (\`b\`) and Settings (\`s\`).
          6. An automated smoke test (the background service starts by itself; Java and the menu load) will be added to this issue shortly.

          ## How to release it

          Once you're satisfied this revision is good, promote it to stable by commenting:

          \`\`\`
          /promote <revision>[,<revision>...] stable [done]
          \`\`\`

          - \`<revision>\` - the revision number(s) to release (comma-separated for more than one)
          - \`stable\` - required as shown; this command only ever promotes to \`stable\`
          - \`done\` (optional) - also closes this issue once released; leave it off to release and keep the issue open for further testing

          For this revision, that's:

          \`\`\`
          /promote ${REVISION} stable done
          \`\`\`

          That queues \`promote-to-stable.yml\` (the \`promote-stable\` environment), which runs \`snapcraft release\`.

          ---
          _Opened automatically after a successful build on \`master\`._
          EOF
          )

          url=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "Call for testing: v${VERSION} (revision ${REVISION})" \
            --label "call-for-testing" \
            --body "$body")
          echo "issue-number=$(basename "$url")" >> "$GITHUB_OUTPUT"

  # A terminal app, so no screenshots: instead, install the candidate from
  # the store on a clean runner and check that the background service
  # started by itself and answers, and that Java and the menu load.
  smoke-test:
    needs: [publish-candidate, open-issue]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Install the candidate revision
        env:
          REVISION: ${{ needs.publish-candidate.outputs.revision }}
        run: |
          # Retried: the Snap Store's CDN has had transient failures.
          for attempt in 1 2 3; do
            sudo snap install "${SNAP_NAME}" --revision "${REVISION}" && break
            [[ "$attempt" == 3 ]] && { echo "::error::snap install failed after 3 attempts"; exit 1; }
            sleep 30
          done

      - name: Check the background service, Java and the menu
        run: |
          for i in $(seq 1 30); do "${SNAP_NAME}".ctl status >/dev/null 2>&1 && break; sleep 2; done
          {
            echo "== The background service, started by itself at install:"
            snap services "${SNAP_NAME}"
            echo
            echo "== It answers:"
            "${SNAP_NAME}".ctl status | grep -E '"ok"|"running"|"you_may_change"'
            echo
            echo "== The bundled Java, and the menu with its library:"
            snap run --shell "${SNAP_NAME}" -c '
              set -e
              java="$(ls -d "$SNAP"/usr/lib/jvm/java-*/bin/java | head -1)"
              "$java" -version 2>&1 | head -1
              PYTHONPATH="$SNAP/lib" "$SNAP/bin/python3" -c "import textual, mcsi.menu; print(\"menu loads with Textual\", textual.__version__)"
            '
          } 2>&1 | tee smoke.txt
          snap services "${SNAP_NAME}" | grep -q " active "

      - name: Comment on the call for testing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.open-issue.outputs.issue-number }}
          REVISION: ${{ needs.publish-candidate.outputs.revision }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          Automated smoke test of revision ${REVISION}, installed fresh from the store: the background service started by itself and answers, and Java and the menu load.

          \`\`\`
          $(cat smoke.txt)
          \`\`\`

          ---

          Looks good? Comment \`/promote ${REVISION} stable done\` on this issue to release it to \`latest/stable\` and close this issue (drop \`done\` to release without closing).
          EOF
          )"

      - name: Comment on the issue if the smoke test failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.open-issue.outputs.issue-number }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "The automated smoke test failed for this revision - see the [workflow run](${run_url}). Check whether it's a store/CDN hiccup or a real problem (a bundled tool missing or not running) before promoting."
