name: 🛡️ Security Rebuild

# Once a day, runs the Snap Store's own security check
# (review-tools.snap-check-notices - the same check behind the store's
# "a rebuild would fix this" emails) against the snap published on stable.
# When Ubuntu has published fixes for packages bundled in it (OpenJDK, curl,
# tmux, ...), this:
#
# 1. rebuilds the snap from the exact commit that stable revision was built
#    from - never from master, which may hold unreleased work. That commit
#    is the "snap-rev-<revision>" tag call-for-testing.yml (and this
#    workflow) push for every revision uploaded. The version comes from the
#    last v* tag, so the rebuild has the same version as stable;
# 2. checks the new build, and uploads it to the candidate channel;
# 3. opens a call-for-testing issue (labels: call-for-testing,
#    security-rebuild) listing the notices it fixes. Release it with the
#    usual "/promote <revision> stable done" comment (promote-to-stable.yml).
#
# Nothing happens while a security-rebuild issue is still open, so an
# unreleased rebuild isn't rebuilt again every day.
#
# Nor while candidate holds a newer version than stable (a release still
# under test): uploading the rebuild to candidate would replace it, and
# testers would refresh back to the old version. Instead it comments once
# on that release's call-for-testing issue with stable's notices, and
# whether promoting the candidate fixes them.
#
# Every architecture on stable (amd64, arm64) is checked and, when any has
# notices, all are rebuilt - each on its own kind of machine - so stable
# stays one version built from one commit.
#
# Run it by hand from the Actions tab (Run workflow):
# - dry_run: checks and reports, but builds, uploads, and opens nothing
# - force: rebuilds even if there are no notices (to test the pipeline)
# - beside_candidate: while a newer release is under test on candidate,
#   rebuilds stable anyway, into the candidate/security branch, which
#   leaves the release under test alone. For a fix that can't wait for that
#   release; promote it the usual way. A branch expires after 30 days.

on:
  schedule:
    - cron: "57 9 * * *"  # daily, 09:57 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check and report - don't build, upload, or open an issue"
        type: boolean
        default: true
      force:
        description: "Rebuild even if there are no security notices"
        type: boolean
        default: false
      beside_candidate:
        description: "While a newer release is under test on candidate, rebuild stable into candidate/security anyway"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-rebuild
  cancel-in-progress: false

env:
  SNAP_NAME: mc-server-installer

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # the comment on a release under test (see the top)
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
      channel: ${{ steps.decide.outputs.channel }}  # candidate, or candidate/security
      version: ${{ steps.stable.outputs.version }}
      stable_revision: ${{ steps.stable.outputs.revisions }}
      commit: ${{ steps.commit.outputs.commit }}
      matrix: ${{ steps.stable.outputs.matrix }}
    steps:
      - name: Checkout (full history and tags, to find the release commit)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install review-tools
        run: |
          # Retried: the Snap Store's CDN has had transient failures.
          for attempt in 1 2 3; do
            sudo snap install review-tools && break
            [[ "$attempt" == 3 ]] && { echo "::error::snap install review-tools failed"; exit 1; }
            sleep 30
          done

      - name: Download the stable snap of every architecture
        id: stable
        run: |
          # The store's public info API lists each architecture's revision
          # and download (snap download only fetches this machine's).
          curl -sf -H "Snap-Device-Series: 16" \
            "https://api.snapcraft.io/v2/snaps/info/${SNAP_NAME}?fields=revision,version,download" > info.json
          python3 - <<'EOF'
          import json, os, urllib.request
          runners = {"amd64": "ubuntu-latest", "arm64": "ubuntu-24.04-arm"}
          channels = [c for c in json.load(open("info.json"))["channel-map"]
                      if c["channel"]["track"] == "latest"]
          stable = [c for c in channels if c["channel"]["name"] == "stable"]
          for c in stable:
              arch = c["channel"]["architecture"]
              urllib.request.urlretrieve(c["download"]["url"], f"stable-{arch}.snap")
              open(f"stable-{arch}.revision", "w").write(str(c["revision"]))
              print(f"Stable {arch}: version {c['version']}, revision {c['revision']}")
          # A newer version on candidate is a release under test: downloaded
          # too, to say whether promoting it fixes stable's notices.
          number = lambda v: tuple(int(p) for p in v.split(".") if p.isdigit())
          newer = [c for c in channels if c["channel"]["name"] == "candidate"
                   and number(c["version"]) > number(stable[0]["version"])]
          for c in newer:
              arch = c["channel"]["architecture"]
              urllib.request.urlretrieve(c["download"]["url"], f"candidate-{arch}.snap")
              print(f"Candidate {arch}: version {c['version']}, revision {c['revision']} - a release under test")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"candidate_version={newer[0]['version'] if newer else ''}\n")
              out.write(f"version={stable[0]['version']}\n")
              out.write("revisions=" + ", ".join(f"{c['revision']} ({c['channel']['architecture']})"
                                                 for c in stable) + "\n")
              out.write("matrix=" + json.dumps([{"arch": c["channel"]["architecture"],
                                                 "runner": runners[c["channel"]["architecture"]]}
                                                for c in stable]) + "\n")
          EOF

      - name: Check for security notices
        run: |
          for snap in stable-*.snap; do
            review-tools.snap-check-notices "$snap" | tee "${snap%.snap}.notices.json"
          done
          # {"<snap>": {"<revision>": {"<package>": ["USN-...", ...]}}} - empty when none.
          # Merged across architectures: a fix for any of them rebuilds all.
          python3 - <<'EOF'
          import glob, json
          notices = {}
          for path in glob.glob("stable-*.notices.json"):
              raw = json.load(open(path))
              for package, usns in (next(iter(next(iter(raw.values())).values()), {}) if raw else {}).items():
                  notices[package] = sorted(set(notices.get(package, [])) | set(usns))
          json.dump(notices, open("notices.json", "w"), indent=2, sort_keys=True)
          print(f"{sum(len(v) for v in notices.values())} notice(s) across {len(notices)} package(s)")
          EOF
          for snap in candidate-*.snap; do
            [[ -e "$snap" ]] || continue
            review-tools.snap-check-notices "$snap" | tee "${snap%.snap}.notices.json"
          done
          # How many of stable's notices the release under test still has.
          python3 - <<'EOF'
          import glob, json
          stable = json.load(open("notices.json"))
          left = set()
          for path in glob.glob("candidate-*.notices.json"):
              raw = json.load(open(path))
              for package, usns in (next(iter(next(iter(raw.values())).values()), {}) if raw else {}).items():
                  left |= set(usns) & set(stable.get(package, []))
          open("candidate-unfixed", "w").write(str(len(left)))
          EOF

      - name: Find the commit stable was built from
        id: commit
        run: |
          # Refuses rather than guessing (e.g. from the v* tag, which
          # master has usually moved past): rebuilding the wrong commit
          # would ship different code under the stable version number.
          commits=""
          for file in stable-*.revision; do
            revision="$(cat "$file")"
            if ! commit="$(git rev-parse --verify --quiet "refs/tags/snap-rev-${revision}^{commit}")"; then
              echo "::error::No snap-rev-${revision} tag - don't know which commit stable revision ${revision} was built from. Tag it by hand: git tag snap-rev-${revision} <commit> && git push origin snap-rev-${revision}"
              exit 1
            fi
            arch="${file#stable-}"
            echo "Stable revision ${revision} (${arch%.revision}) was built from: $(git log -1 --format='%h %s' "$commit")"
            commits+="$commit"$'\n'
          done
          if [[ "$(sort -u <<< "${commits%$'\n'}" | wc -l)" != 1 ]]; then
            echo "::error::The architectures on stable were built from different commits - release them together first."
            exit 1
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          BESIDE_CANDIDATE: ${{ inputs.beside_candidate }}
          CANDIDATE_VERSION: ${{ steps.stable.outputs.candidate_version }}
        run: |
          channel=candidate
          count="$(python3 -c "import json; print(sum(len(v) for v in json.load(open('notices.json')).values()))")"
          open_issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label security-rebuild --state open --json number --jq '.[0].number // empty')"
          rebuild=false
          if [[ -n "$open_issue" ]]; then
            echo "Security rebuild issue #$open_issue is still open - not rebuilding again."
          elif [[ "$count" -gt 0 || "$FORCE" == "true" ]]; then
            rebuild=true
          else
            echo "No security notices - nothing to do."
          fi
          if [[ "$rebuild" == "true" && -n "$CANDIDATE_VERSION" && "$BESIDE_CANDIDATE" == "true" ]]; then
            channel=candidate/security
            echo "Candidate holds ${CANDIDATE_VERSION}, a release under test - rebuilding stable into ${channel} beside it."
          elif [[ "$rebuild" == "true" && -n "$CANDIDATE_VERSION" ]]; then
            rebuild=false
            echo "Candidate holds ${CANDIDATE_VERSION}, a release under test - not replacing it with a ${{ steps.stable.outputs.version }} rebuild."
            issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label call-for-testing --state open \
              --search "in:title v${CANDIDATE_VERSION}" --json number,labels \
              --jq '[.[] | select(all(.labels[]; .name != "security-rebuild"))][0].number // empty')"
            marker="<!-- security-rebuild: stable ${{ steps.stable.outputs.version }} has notices -->"
            if [[ -z "$issue" ]]; then
              echo "::warning::No open call-for-testing issue for ${CANDIDATE_VERSION} to tell."
            elif gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
              echo "Already told #$issue."
            elif [[ "$DRY_RUN" != "true" ]]; then
              if [[ "$(cat candidate-unfixed)" == 0 ]]; then
                advice="This candidate doesn't have them, so promoting it fixes stable."
              else
                advice="This candidate has $(cat candidate-unfixed) of them too: rebuild it (Actions → 📣 Call for Testing → Run workflow) before promoting."
              fi
              advice+=" If a fix can't wait for this release: Actions → 🛡️ Security Rebuild → Run workflow, with dry_run off and beside_candidate on, rebuilds stable into \`candidate/security\` without touching this candidate."
              notices="$(python3 -c "import json; [print(f'- \`{p}\`: ' + ', '.join(u)) for p, u in sorted(json.load(open('notices.json')).items())]")"
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\nStable (%s, revisions %s) has security notices from Ubuntu. The daily security rebuild is waiting rather than replacing this %s candidate with a %s rebuild.\n\n%s\n\n%s\n\n---\n_Posted by `security-rebuild.yml`._' \
                "$marker" "${{ steps.stable.outputs.version }}" "${{ steps.stable.outputs.revisions }}" "$CANDIDATE_VERSION" "${{ steps.stable.outputs.version }}" "$notices" "$advice")"
            fi
          fi
          if [[ "$DRY_RUN" == "true" && "$rebuild" == "true" ]]; then
            echo "Dry run: would rebuild version ${{ steps.stable.outputs.version }} from ${{ steps.commit.outputs.commit }} into ${channel}."
            rebuild=false
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Keep the notices for the next job
        uses: actions/upload-artifact@v7
        with:
          name: notices
          path: notices.json

  # One leg per architecture on stable; each leaves its revision in a
  # "revision-<arch>" artifact (a matrix job's outputs keep only one leg's).
  rebuild:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}
          # For the version (git describe --tags, see snap/snapcraft.yaml).
          fetch-depth: 0
          fetch-tags: true

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: pack

      - name: Check the new build
        run: |
          for attempt in 1 2 3; do
            sudo snap install review-tools && break
            [[ "$attempt" == 3 ]] && exit 1
            sleep 30
          done
          review-tools.snap-check-notices "${{ steps.build.outputs.snap }}" | tee rebuilt-notices.json

      - name: Upload to the candidate channel
        id: upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHANNEL: ${{ needs.check.outputs.channel }}
        run: |
          # "candidate", not "latest/candidate" - see call-for-testing.yml.
          # candidate/security (beside_candidate) is a branch: the store login
          # may not be allowed to release to one.
          output="$(snapcraft upload "${{ steps.build.outputs.snap }}" --release="$CHANNEL")" || {
            echo "$output"
            [[ "$CHANNEL" == candidate ]] || echo "::error::Couldn't release to ${CHANNEL}: the store login (SNAPCRAFT_STORE_CREDENTIALS) may not cover branches. Export one with --channels including ${CHANNEL}, or release the uploaded revision by hand."
            exit 1
          }
          echo "$output"
          revision="$(grep -Po 'Revision \K[0-9]+' <<< "$output")"
          [[ -n "$revision" ]] || { echo "Could not parse a revision from 'snapcraft upload'"; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # So the next check can find this revision's commit once it's stable.
      - name: Record the commit this revision was built from
        run: |
          git tag "snap-rev-${{ steps.upload.outputs.revision }}" "${{ needs.check.outputs.commit }}"
          git push origin "snap-rev-${{ steps.upload.outputs.revision }}"

      - name: Leave the revision for the issue
        run: echo "${{ steps.upload.outputs.revision }}" > "revision-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: revision-${{ matrix.arch }}
          path: revision-${{ matrix.arch }}

  open-issue:
    needs: [check, rebuild]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download the notices
        uses: actions/download-artifact@v8
        with:
          name: notices

      - uses: actions/download-artifact@v8
        with:
          pattern: revision-*
          merge-multiple: true

      - name: Collect the revisions
        id: revisions
        run: |
          list="" readable=""
          for file in revision-*; do
            list+="${list:+,}$(cat "$file")"
            readable+="${readable:+, }$(cat "$file") (${file#revision-})"
          done
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "readable=$readable" >> "$GITHUB_OUTPUT"

      - name: Open the call for testing issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          STABLE_REVISION: ${{ needs.check.outputs.stable_revision }}
          REVISION: ${{ steps.revisions.outputs.list }}
          READABLE: ${{ steps.revisions.outputs.readable }}
          COMMIT: ${{ needs.check.outputs.commit }}
          CHANNEL: ${{ needs.check.outputs.channel }}
        run: |
          for label in call-for-testing security-rebuild; do
            gh label create "$label" --repo "$GITHUB_REPOSITORY" --color "B60205" \
              --description "Automated rebuild picking up Ubuntu security fixes" 2>/dev/null || true
          done

          notices="$(python3 - <<'EOF'
          import json
          notices = json.load(open("notices.json"))
          if not notices:
              print("_None - this rebuild was started by hand (force)._")
          for package, usns in sorted(notices.items()):
              links = ", ".join(f"[{u}](https://ubuntu.com/security/notices/{u})" for u in usns)
              print(f"- `{package}`: {links}")
          EOF
          )"

          body=$(cat <<EOF
          A security rebuild of Minecraft Server Installer is ready for testing.

          Ubuntu has published security fixes for packages bundled in the current stable snap (revisions ${STABLE_REVISION}). This build is the **same version, ${VERSION}**, rebuilt from the commit stable was built from (\`${COMMIT:0:7}\`) so it picks up those fixes. Nothing else has changed.

          ## Fixed notices

          ${notices}

          **Revisions:** ${READABLE} · **Channel:** \`latest/${CHANNEL}\`

          ## How to test

          \`\`\`
          sudo snap refresh ${SNAP_NAME} --channel latest/${CHANNEL}
          \`\`\`

          Open the menu, check the status says the server is running, and join it from Minecraft.

          ## How to release it

          Comment:

          \`\`\`
          /promote ${REVISION} stable done
          \`\`\`

          That queues \`promote-to-stable.yml\` (the \`promote-stable\` environment) and closes this issue once released. Until this issue is closed, the daily check won't rebuild again.

          ---
          _Opened automatically by \`security-rebuild.yml\`._
          EOF
          )

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Security rebuild: v${VERSION} (revisions ${REVISION})" \
            --label call-for-testing --label security-rebuild \
            --body "$body"
